[package]
name = "konnektoren-yew-review"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Challenge reviews and ratings for Konnektoren applications"

[features]
default = []
csr = ["konnektoren-yew-core/csr", "yew/csr", "dep:wasm-bindgen-futures", "dep:web-sys", "konnektoren-yew-web-analytics?/csr"]
# Track submitted and failed reviews through the app's web analytics provider.
web-analytics = ["dep:konnektoren-yew-web-analytics"]
yew-preview = ["dep:yew-preview"]

[dependencies]
konnektoren-yew-core.workspace = true
konnektoren-core = { workspace = true, features = ["js"] }
konnektoren-yew-web-analytics = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
yew.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["HtmlInputElement"] }
yew-preview = { workspace = true, optional = true }

[dev-dependencies]
yew = { workspace = true, features = ["ssr"] }
tokio = { workspace = true, features = ["rt", "macros"] }
