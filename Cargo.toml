[package]
name = "konnektoren-yew"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["crates/konnektoren-yew-web-analytics", "crates/konnektoren-yew-review", "crates/konnektoren-yew-navigation", "crates/konnektoren-yew-i18n", "crates/konnektoren-yew-faq", "crates/konnektoren-yew-history", "crates/konnektoren-yew-core"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = "1"
serde_yaml = "0.9"
strsim = "0.11"
wasm-bindgen-test = "0.3"
konnektoren-yew-i18n = { path = "crates/konnektoren-yew-i18n", version = "0.7.0", default-features = false }
konnektoren-rs = { git = "https://github.com/konnektoren/konnektoren-rs.git", default-features = false, features = ["content", "platform"] }
gloo = "0.12"
yew_router = { git = "https://github.com/chriamue/yew-ssg", package = "yew-ssg-router" }
konnektoren-yew-navigation = { path = "crates/konnektoren-yew-navigation", default-features = false }
konnektoren-yew-web-analytics = { path = "crates/konnektoren-yew-web-analytics", default-features = false }
konnektoren-yew-review = { path = "crates/konnektoren-yew-review", default-features = false }
konnektoren-yew-faq = { path = "crates/konnektoren-yew-faq", default-features = false }
konnektoren-yew-history = { path = "crates/konnektoren-yew-history", default-features = false }
konnektoren-yew-core = { path = "crates/konnektoren-yew-core", default-features = false }
konnektoren-core = { git = "https://github.com/konnektoren/konnektoren-rs.git", default-features = false }
serde_json = "1"
thiserror = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = "0.3"
tracing = "0.1"
tokio = "1"
wasm-bindgen-futures = "0.4"
yew = { version = "0.23", default-features = false }
yew-preview = { git = "https://github.com/chriamue/yew-preview" }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "konnektoren-yew-bin"
path = "src/main.rs"

[[bin]]
name = "konnektoren-yew-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "ssg"
path = "src/bin/ssg.rs"
required-features = ["ssg"]

[[bin]]
name = "i18n-report"
path = "src/bin/i18n_report.rs"
required-features = ["tools"]

[[bin]]
name = "catalog"
path = "src/bin/catalog.rs"
required-features = ["catalog"]

[features]
default = [
    "certificates",
    "effects",
    "marketplace",
    "music",
    "storage",
    "gdrive",
    "tour",
    "slideshow",
    "review",
    "navigation",
    "faq",
    "history"
]
navigation = ["dep:konnektoren-yew-navigation"]
achievements = ["konnektoren-core/achievements"]
web-analytics = ["dep:konnektoren-yew-web-analytics", "konnektoren-yew-review?/web-analytics"]
# Challenge reviews and ratings (ChallengeReviewComponent, ChallengeRatingComponent, FeedbackPopup).
review = ["dep:konnektoren-yew-review"]
# FAQ list, search and page (konnektoren-yew-faq).
faq = ["dep:konnektoren-yew-faq"]
# Searchable history pages (konnektoren-yew-history).
history = ["dep:konnektoren-yew-history"]
web-analytics-gtm = ["web-analytics", "konnektoren-yew-web-analytics/gtm"]
backup = []
certificates = [
    "achievements",
    "konnektoren-core/certificates",
]
chat = []
effects = ["gloo/timers", "gloo/futures"]
marketplace = ["konnektoren-core/marketplace"]
music = []
slideshow = []
storage = ["gloo/storage", "konnektoren-yew-i18n/storage"]
yew-preview = ["navigation", "dep:yew-preview", "konnektoren-yew-core/yew-preview", "konnektoren-yew-review?/yew-preview", "konnektoren-yew-navigation?/yew-preview", "konnektoren-yew-faq?/yew-preview", "konnektoren-yew-history?/yew-preview"]
catalog = ["yew-preview", "yew-preview/catalog", "ssr"]
gdrive = ["backup"]
tour = ["yew-tou-rs"]
solana = ["solana-sdk", "wallet-adapter", "spl-token"]
sbom = ["cargo-cyclonedx"]
csr = [
    "konnektoren-yew-i18n/csr",
    "konnektoren-yew-core/csr",
    "konnektoren-yew-web-analytics?/csr",
    "konnektoren-yew-review?/csr",
    "konnektoren-yew-faq?/csr",
    "konnektoren-yew-history?/csr",
    "konnektoren-yew-navigation?/csr",
    "yew/csr",
    "gloo",
    "konnektoren-core/csr",
    "konnektoren-asset-loader/csr",
    "konnektoren-platform/csr",
    "web-sys",
    "js-sys",
    "wasm-bindgen",
    "yew-hooks",
    "uuid/js",
    "dep:wasm-bindgen-futures",
    "dep:tracing-wasm",
]
ssr = ["konnektoren-yew-i18n/ssr", "konnektoren-yew-core/ssr", "konnektoren-yew-navigation?/ssr", "konnektoren-yew-history?/ssr", "yew/ssr", "yew_router/ssg", "konnektoren-core/ssr"]
ssg = ["ssr", "yew-ssg", "yew_router/ssg", "tokio"]
server = ["ssr", "axum", "tokio/full"]
tools = ["konnektoren-platform/tools"]

[dependencies]
konnektoren-yew-i18n.workspace = true
# Basic stateless components shared with the sub-crates; always on.
konnektoren-yew-core.workspace = true
konnektoren-yew-navigation = { workspace = true, optional = true }
konnektoren-yew-web-analytics = { workspace = true, optional = true }
konnektoren-yew-review = { workspace = true, optional = true }
konnektoren-yew-faq = { workspace = true, optional = true }
konnektoren-yew-history = { workspace = true, optional = true, features = ["challenge"] }
# Core dependencies
async-trait = "0.1"
bincode = "1"
chrono = "0.4"
futures = "0.3"
hex = "0.4"
implicit-clone = "0.6"
indexmap = "2"
tracing = "0.1"
tracing-wasm = { version = "0.2", optional = true }
markdown = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml.workspace = true
thiserror = "2"

# WASM dependencies - aligned with konnektoren-rs
getrandom = { version = "0.4", features = ["wasm_js"] }
gloo = { workspace = true, features = ["net"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true, features = [
    "spans",
    "std",
    "serde",
], default-features = false }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "EventListener",
    "MouseEvent",
    "Node",
    "HtmlInputElement",
    "HtmlAudioElement",
    "AudioContext",
    "HtmlSelectElement",
    "Window",
    "Navigator",
    "DomTokenList",
    "DragEvent",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "TouchList",
    "Touch",
    "HtmlElement",
    "HtmlMetaElement",
    "Element",
    "DomRect",
    "MediaQueryList",
    "MediaQueryListEvent",
] }

# Common utilities
rand = "0.10"
regex = "1"
rust-embed = { version = "8", features = [
    "interpolate-folder-path",
    "debug-embed",
] }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

# Yew ecosystem
yew = "0.23"
yew-hooks = { version = "0.6.4", optional = true }
yew_router.workspace = true
yew-ssg = { git = "https://github.com/chriamue/yew-ssg", optional = true }
yew-preview = { git = "https://github.com/chriamue/yew-preview", optional = true }
yew-chat = { git = "https://github.com/chriamue/yew-chat", features = [
    "yew",
], default-features = false }
yew-tou-rs = { git = "https://github.com/chriamue/yew-tou-rs/", branch = "main", features = [
    "markdown",
], optional = true }

# Konnektoren dependencies
konnektoren-platform = { git = "https://github.com/konnektoren/konnektoren-rs.git" }
konnektoren-rs.workspace = true
konnektoren-core = { git = "https://github.com/konnektoren/konnektoren-rs.git", features = [
    "js",
] }
konnektoren-asset-loader = { git = "https://github.com/konnektoren/konnektoren-rs.git" }

# Solana dependencies (optional, not in default)
wallet-adapter = { version = "1", optional = true }
solana-sdk = { version = "2", optional = true }
spl-token = { version = "7", optional = true }

# Server dependencies
axum = { version = "0.8", features = ["macros"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
], optional = true }

[dev-dependencies]
konnektoren-platform = { git = "https://github.com/konnektoren/konnektoren-rs.git", features = [
    "tools",
] }
wasm-bindgen-test.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
walkdir = "2"
serde_json = "1"

[build-dependencies]
anyhow = "1"
vergen = { version = "10", features = ["build", "cargo", "rustc"] }
cargo-cyclonedx = { version = "0.4", optional = true }
serde.workspace = true
serde_json = "1"
