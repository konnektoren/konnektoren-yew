[package]
name = "konnektoren-yew-navigation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable navigation components for Konnektoren applications"

[features]
default = []
csr = ["konnektoren-yew-i18n/csr", "yew/csr", "dep:gloo", "dep:wasm-bindgen", "dep:web-sys"]
ssr = ["konnektoren-yew-i18n/ssr", "yew/ssr", "yew_router/ssg"]
yew-preview = ["dep:yew-preview"]

[dependencies]
konnektoren-yew-i18n.workspace = true
yew.workspace = true
yew_router.workspace = true
gloo = { workspace = true, features = ["events"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Document", "Element", "Node", "KeyboardEvent"] }
yew-preview = { workspace = true, optional = true }

[dev-dependencies]
yew = { workspace = true, features = ["ssr"] }
tokio = { workspace = true, features = ["rt", "macros"] }
serde_json.workspace = true
