# `midi` is a host key: the application decodes it via `Excursion<MyStep>`.
# Playback itself does not know about MIDI.
version: 1
id: midi-demo
title: MIDI extension example
steps:
  - say: "Listen to the notes."
  - say: "Here they come."
    selector: "#piano"
    highlight: true
    midi:
      - { pitch: 60, duration_ms: 300, gap_ms: 100 }
      - { pitch: 64, duration_ms: 300, gap_ms: 100 }
