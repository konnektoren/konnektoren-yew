[package]
name = "konnektoren-yew-web-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Consent-aware web analytics events for Konnektoren applications"

[features]
default = []
csr = ["yew/csr"]
gtm = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys", "dep:tracing"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
yew = { version = "0.23", default-features = false }
tracing = { version = "0.1", optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window"] }

[dev-dependencies]
yew = { version = "0.23", default-features = false, features = ["ssr"] }
tokio = { version = "1", features = ["rt", "macros"] }
