[package]
name = "konnektoren-yew-playback"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scripted UI playback for Konnektoren applications"

[features]
default = []
csr = ["yew/csr", "dep:gloo-events", "dep:gloo-timers", "dep:wasm-bindgen", "dep:web-sys"]
ssr = ["yew/ssr"]
yew-preview = ["dep:yew-preview"]

[dependencies]
yew.workspace = true
yew-preview = { workspace = true, optional = true }
gloo-timers = { version = "0.3", optional = true }
gloo-events = { version = "0.2", optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "DomRect", "KeyboardEvent"] }

[dev-dependencies]
yew = { workspace = true, features = ["ssr"] }
tokio = { workspace = true, features = ["rt", "macros"] }
