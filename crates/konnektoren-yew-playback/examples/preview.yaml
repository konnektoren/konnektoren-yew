version: 1
id: preview
title: Preview excursion
steps:
  - say: "Welcome to the example page."
  - say: "This is the page heading."
    selector: ".playback-engine-preview__header"
    highlight: true
  - say: "Here is the list."
    selector: ".playback-engine-preview__list"
    highlight: true
  - say: "Type a name."
    selector: ".playback-engine-preview__input"
    highlight: true
    fill: "Alex"
  - say: "And press the button."
    selector: ".playback-engine-preview__button-target"
    click: true
