# Example excursion format; execution is not implemented yet.
version: 1
id: introduction
title: Introduction
steps:
  - say: "Welcome to the demonstration."
  - goto: /challenges
  - zoom: 1.1
  - scroll: { x: 0, y: 300 }
  - wait_for: "[data-testid='challenge-search']"
  - highlight: "[data-testid='challenge-search']"
  - fill:
      selector: "[data-testid='challenge-search']"
      value: grammar
  - press:
      selector: "[data-testid='challenge-search']"
      key: Enter
  - scroll_into_view: "[data-testid='challenge-card']"
  - click: "[data-testid='challenge-card']"
  - say: "Choose an exercise to begin."
